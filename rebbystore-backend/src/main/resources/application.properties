spring.application.name=rebbystore-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/rebbystore
spring.datasource.username=rebbystore_app
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/rebbystore
spring.flyway.user=postgres
spring.flyway.password=${POSTGRES_DB_PASSWORD}