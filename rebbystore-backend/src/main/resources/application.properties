spring.application.name=rebbystore-backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rebbystore}
spring.datasource.username=${DB_USERNAME:rebbystore_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_DB_URL:jdbc:postgresql://localhost:5432/rebbystore}
spring.flyway.user=${FLYWAY_DB_USERNAME:postgres}
spring.flyway.password=${POSTGRES_DB_PASSWORD}

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Rate limiting
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:10}
rate-limit.login.refill-minutes=${RATE_LIMIT_LOGIN_REFILL_MINUTES:1}

rate-limit.general.capacity=${RATE_LIMIT_GENERAL_CAPACITY:120}
rate-limit.general.refill-minutes=${RATE_LIMIT_GENERAL_REFILL_MINUTES:1}

rate-limit.max-clients=${RATE_LIMIT_MAX_CLIENTS:10000}
rate-limit.cleanup-minutes=${RATE_LIMIT_CLEANUP_MINUTES:10}